<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - My Gym</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-[24px] shadow-lg border border-gray-100 flex flex-col md:flex-row max-w-4xl w-full overflow-hidden">
        
        <!-- Left Side: Image/Branding -->
        <div class="w-full md:w-1/2 bg-gradient-to-br from-[#0f172a] to-[#1e293b] p-10 text-white flex flex-col justify-center items-center text-center">
            <i class="fa-solid fa-dumbbell text-6xl mb-4 text-blue-400"></i>
            <h1 class="text-3xl font-bold mb-2">My.Gym System</h1>
            <p class="text-sm text-gray-400">Login to access your dashboard, track attendance, and manage your membership seamlessly.</p>
        </div>

        <!-- Right Side: Login Form -->
        <div class="w-full md:w-1/2 p-8 md:p-12">
            <h2 class="text-2xl font-bold text-gray-900 mb-1">Welcome Back!</h2>
            <p class="text-sm text-gray-500 mb-8">Please enter your credentials to continue.</p>

            <form id="loginForm">
                <!-- Username Field -->
                <div class="mb-5">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Username</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-4 top-3.5 text-gray-400"></i>
                        <input type="text" id="username" class="w-full border border-gray-300 rounded-xl pl-10 pr-4 py-3 outline-none text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition" placeholder="Enter username" required>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="mb-6">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-3.5 text-gray-400"></i>
                        <input type="password" id="password" class="w-full border border-gray-300 rounded-xl pl-10 pr-4 py-3 outline-none text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition" placeholder="••••••••" required>
                    </div>
                </div>

                <!-- Error Message Container -->
                <div id="errorMessage" class="hidden mb-4 text-sm text-rose-500 bg-rose-50 border border-rose-100 p-3 rounded-lg flex items-center gap-2">
                    <i class="fa-solid fa-circle-exclamation"></i> <span></span>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-[#1e293b] hover:bg-gray-900 text-white font-bold py-3.5 rounded-xl transition shadow-sm mb-4">
                    Sign In
                </button>
            </form>

            <div class="text-center text-xs text-gray-400 mt-4 border-t border-gray-100 pt-6">
                Sign in using your gym account credentials.
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            try {
                const response = await fetch('http://localhost:5000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    errorDiv.classList.add('hidden');
                    
                    // Token සහ User විස්තර Browser එකේ Save කරගැනීම
                    localStorage.setItem('gym_token', data.token);
                    localStorage.setItem('gym_role', data.role);
                    
                    if (data.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else if (data.role === 'member') {
                        localStorage.setItem('gym_member_id', data.member_id);
                        window.location.href = 'member.html';
                    }
                } else {
                    errorDiv.classList.remove('hidden');
                    errorDiv.querySelector('span').innerText = data.message;
                }
            } catch (err) {
                errorDiv.classList.remove('hidden');
                errorDiv.querySelector('span').innerText = "Server connection failed. Is the backend running?";
            }
        });
    </script>
</body>
</html>
